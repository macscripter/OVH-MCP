{{- include "bridge.validate" . -}}
{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bridge.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "bridge.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  application.properties: |
    # =================================================================================
    # Simpl-Open — Governance Authority — Bridge
    # GENERATED BY HELM — chart {{ include "bridge.chart" . }}, release {{ .Release.Name }}.
    # Edit charts/bridge/values.yaml, not this ConfigMap: it is overwritten on every
    # upgrade and the pod is rolled by a checksum annotation when it changes.
    #
    # Mounted at {{ .Values.config.mountPath }}/application.properties and loaded through
    # SMALLRYE_CONFIG_LOCATIONS. config_ordinal below puts it above the properties baked
    # into the image and below environment variables.
    # =================================================================================
    config_ordinal={{ int .Values.config.ordinal }}

    # ---- Runtime surface -------------------------------------------------------------
    quarkus.http.port={{ int .Values.containerPorts.http }}
    quarkus.http.host=0.0.0.0
    quarkus.management.enabled={{ .Values.management.enabled }}
    {{- if .Values.management.enabled }}
    quarkus.management.port={{ int .Values.containerPorts.management }}
    quarkus.management.host=0.0.0.0
    {{- end }}
    # Shorter than terminationGracePeriodSeconds ({{ .Values.terminationGracePeriodSeconds }}s), so
    # Quarkus finishes in-flight searches on its own terms before the kubelet escalates.
    quarkus.shutdown.timeout={{ sub (int .Values.terminationGracePeriodSeconds) 10 }}S

    # ---- Health ----------------------------------------------------------------------
    # Readiness must not depend on anything external. The brief requires that Bridge or
    # DOME unavailability cause ZERO impact on internal search; a readiness check that
    # turns red when Redis or Elasticsearch is down would remove the endpoint that is
    # supposed to answer 200 + degraded=true. Cache faults are treated as misses, and the
    # audit sink is not on the request path at all.
    # quarkus.redis.health.enabled is build time and is set in application.properties
    quarkus.elasticsearch.health.enabled=false

    # ---- Logging — JSON to stdout, Filebeat to ELK (BRG-D-13) ------------------------
    quarkus.log.console.json.enabled={{ .Values.logging.json }}
    {{- if .Values.logging.json }}
    quarkus.log.console.json.pretty-print=false
    {{- end }}
    quarkus.log.level={{ .Values.logging.level }}
    quarkus.log.category."eu.europa.ec.simpl.bridge".level={{ .Values.logging.bridgeLevel }}
    {{- range $category, $level := .Values.logging.categories }}
    quarkus.log.category."{{ $category }}".level={{ $level }}
    {{- end }}

    # ---- Camel (BRG-D-04) ------------------------------------------------------------
    camel.context.name={{ include "bridge.fullname" . }}

    # ---- Redis read cache (BRG-D-12) -------------------------------------------------
    quarkus.redis.hosts={{ .Values.redis.hosts }}
    quarkus.redis.timeout={{ int .Values.redis.timeoutMs }}ms
    {{- if .Values.redis.existingSecret.name }}
    # quarkus.redis.password is injected as QUARKUS_REDIS_PASSWORD from Secret
    # {{ .Values.redis.existingSecret.name }} — never rendered here.
    {{- end }}

    # ---- Elasticsearch audit sink (BRG-D-13) -----------------------------------------
    quarkus.elasticsearch.hosts={{ .Values.elk.elasticsearch.hosts }}
    {{- if .Values.elk.elasticsearch.existingSecret.name }}
    # Credentials arrive as QUARKUS_ELASTICSEARCH_USERNAME / _PASSWORD from Secret
    # {{ .Values.elk.elasticsearch.existingSecret.name }}.
    {{- end }}

    # ---- Micrometer, Elastic registry (BRG-D-13) -------------------------------------
    # No Prometheus and no OTLP: the decision is ELK only. There is no Quarkus extension
    # for the Elastic registry, so the plain Micrometer registry is produced as a CDI bean
    # from this bridge.metrics.elastic.* tree.
    quarkus.micrometer.enabled=true
    bridge.metrics.elastic.enabled={{ .Values.elk.metrics.enabled }}
    {{- if .Values.elk.metrics.enabled }}
    bridge.metrics.elastic.host={{ .Values.elk.metrics.host }}
    bridge.metrics.elastic.index={{ .Values.elk.metrics.index }}
    bridge.metrics.elastic.step=PT{{ int .Values.elk.metrics.stepSeconds }}S
    {{- if .Values.elk.metrics.userName }}
    bridge.metrics.elastic.userName={{ .Values.elk.metrics.userName }}
    {{- end }}
    {{- end }}

    # =================================================================================
    # bridge.* — the Bridge's own configuration tree
    # =================================================================================

    # Master gate (BRG-D-09). False leaves the GA agent running without a DOME
    # integration: the Camel routes are not started.
    bridge.enabled={{ .Values.enabled }}

    # ---- Southbound: DOME (BRG-D-08, BRG-D-11) ---------------------------------------
    # Effective read URL: {{ include "bridge.domeEndpoint" . }}
    # Reads are anonymous — verified against the sandbox on 2026-09-12.
    bridge.dome.baseUrl={{ .Values.dome.baseUrl }}
    bridge.dome.api={{ .Values.dome.api }}
    bridge.dome.apiVersion={{ .Values.dome.apiVersion }}
    bridge.dome.productOfferingPath={{ .Values.dome.productOfferingPath }}
    bridge.dome.propagateCorrelationId={{ .Values.dome.propagateCorrelationId }}
    {{- with .Values.dome.auth }}
    bridge.dome.auth.mode={{ .mode }}
    bridge.dome.auth.minRemainingSeconds={{ int .minRemainingSeconds }}
    bridge.dome.auth.sendExpiredStaticToken={{ .sendExpiredStaticToken }}
    bridge.dome.auth.issuer={{ .issuer }}
    bridge.dome.auth.grantType={{ .grantType }}
    bridge.dome.auth.clientAuth={{ .clientAuth }}
    bridge.dome.auth.tokenRequestTimeoutMs={{ int .tokenRequestTimeoutMs }}
    {{- end }}
    {{- with .Values.retention }}
    bridge.retention.operationsDays={{ int .operationsDays }}
    bridge.retention.purgeIntervalMs={{ int .purgeIntervalMs }}
    {{- end }}

    # ---- Read path budget and guardrails ---------------------------------------------
    # DOME latency tracks the OFFSET, not the page size (offset 0 -> 1.8 s,
    # offset 127 -> 11.4 s). Exceeding the budget is answered 200 + degraded=true, never
    # an HTTP error; exceeding maxOffset is a caller-side 400 and says nothing about DOME.
    bridge.search.timeoutMs={{ int .Values.search.timeoutMs }}
    bridge.search.defaultLimit={{ int .Values.search.defaultLimit }}
    bridge.search.maxLimit={{ int .Values.search.maxLimit }}
    bridge.search.maxOffset={{ int .Values.search.maxOffset }}
    bridge.search.keywordStrategy={{ .Values.search.keywordStrategy }}
    bridge.search.defectPolicy={{ .Values.search.defectPolicy }}

    # ---- Read cache (BRG-D-12) -------------------------------------------------------
    bridge.cache.enabled={{ .Values.cache.enabled }}
    bridge.cache.ttlSeconds={{ int .Values.cache.ttlSeconds }}
    bridge.cache.keyPrefix={{ .Values.cache.keyPrefix }}
    bridge.cache.failureThreshold={{ int .Values.cache.failureThreshold }}
    bridge.cache.failureCooldownSeconds={{ int .Values.cache.failureCooldownSeconds }}
    bridge.cache.maxValueBytes={{ int .Values.cache.maxValueBytes }}
    bridge.cache.cacheEmptyPages={{ .Values.cache.cacheEmptyPages }}

    # ---- Depth-aware timeout, retry and circuit breaker ------------------------------
    # An open breaker is the mechanism by which DOME unavailability costs internal search
    # nothing: DOME is not called at all and the answer is degradedReason=CIRCUIT_OPEN.
    # These are the keys ResilienceConfig actually reads; there is no second breaker tree.
    bridge.resilience.timeout.offsetScaling={{ .Values.resilience.timeout.offsetScaling }}
    bridge.resilience.timeout.baseMs={{ int .Values.resilience.timeout.baseMs }}
    bridge.resilience.timeout.perOffsetMs={{ int .Values.resilience.timeout.perOffsetMs }}
    bridge.resilience.timeout.maxMs={{ int .Values.resilience.timeout.maxMs }}
    bridge.resilience.retry.maxAttempts={{ int .Values.resilience.retry.maxAttempts }}
    bridge.resilience.retry.initialBackoffMs={{ int .Values.resilience.retry.initialBackoffMs }}
    bridge.resilience.retry.maxBackoffMs={{ int .Values.resilience.retry.maxBackoffMs }}
    bridge.resilience.retry.multiplier={{ .Values.resilience.retry.multiplier }}
    bridge.resilience.retry.jitterFactor={{ .Values.resilience.retry.jitterFactor }}
    bridge.resilience.retry.retryOnTimeout={{ .Values.resilience.retry.retryOnTimeout }}
    bridge.resilience.breaker.enabled={{ .Values.resilience.breaker.enabled }}
    bridge.resilience.breaker.slidingWindowSize={{ int .Values.resilience.breaker.slidingWindowSize }}
    bridge.resilience.breaker.minimumNumberOfCalls={{ int .Values.resilience.breaker.minimumNumberOfCalls }}
    bridge.resilience.breaker.failureRateThreshold={{ .Values.resilience.breaker.failureRateThreshold }}
    bridge.resilience.breaker.waitDurationInOpenStateMs={{ int .Values.resilience.breaker.waitDurationInOpenStateMs }}
    bridge.resilience.breaker.permittedCallsInHalfOpenState={{ int .Values.resilience.breaker.permittedCallsInHalfOpenState }}
    bridge.resilience.breaker.deepOffsetThreshold={{ int .Values.resilience.breaker.deepOffsetThreshold }}
    bridge.resilience.breaker.recordDeepOffsetTimeouts={{ .Values.resilience.breaker.recordDeepOffsetTimeouts }}

    # ---- Northbound ------------------------------------------------------------------
    bridge.northbound.basePath={{ .Values.northbound.basePath }}
    bridge.northbound.restDslEnabled={{ .Values.northbound.restDslEnabled }}

    # ---- Publication (Increment 2) ---------------------------------------------------
    # Retirement is a lifecycleStatus transition, never a southbound DELETE.
    bridge.publication.retirementStatus={{ .Values.publication.retirementStatus }}

    # ---- Secrets (BRG-D-14) ----------------------------------------------------------
    # A LOCATION in OpenBao, not a credential. Nothing secret is ever rendered into this
    # ConfigMap; the values themselves reach the pod as environment variables from a
    # Secret, or as a file written by the OpenBao agent injector.
    {{- if .Values.openbao.enabled }}
    bridge.openbao.credentialsPath={{ required "bridge: openbao.enabled is true but openbao.credentialsPath is empty (BRG-D-14)." .Values.openbao.credentialsPath }}
    {{- else }}
    # openbao.enabled=false: Increment 1's read path is anonymous and the write path is not
    # validated (BRG-O-04), so no southbound credential is wired yet.
    {{- if .Values.openbao.credentialsPath }}
    bridge.openbao.credentialsPath={{ .Values.openbao.credentialsPath }}
    {{- end }}
    {{- end }}
    {{- with .Values.config.extraProperties }}

    # ---- extraProperties (charts/bridge/values.yaml) ---------------------------------
    {{ . | nindent 4 | trim }}
    {{- end }}
{{- end }}
