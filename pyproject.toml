[project]
name = "simpl-ovh-mcp"
version = "0.1.0"
description = "MCP server that deploys and operates Simpl-Open (plus the DOME Bridge) on OVHcloud Managed Kubernetes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
authors = [{ name = "Alex" }]
dependencies = [
    "fastmcp>=4.0,<5",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
simpl-ovh-mcp = "simpl_ovh_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The tests spell things out on purpose: the OVH signature test mirrors the documented
# formula element by element, and the settings helpers build kwargs with dict().
"tests/*" = ["FLY002", "C408"]
